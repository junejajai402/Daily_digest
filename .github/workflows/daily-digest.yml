name: Daily Digest

concurrency:
  group: daily-digest-send
  cancel-in-progress: false

# Purpose:
# This workflow runs the digest in GitHub Actions on a schedule or manually.
# It keeps the cloud path close to the local flow so the email send and artifact
# export behavior stay easy to reason about.
#
# Good next learning steps:
# - keep the dry-run path handy when you change ranking or source logic
# - inspect artifact output in the logs when a scheduled run looks suspicious
# - keep the homepage sync step pointed at the same canonical artifact
# - keep workflow concurrency and email idempotency aligned so one digest does not send twice

on:
  workflow_dispatch:

  # A timezone-aware schedule stays at 7:17 AM New York time through daylight
  # saving changes. The off-the-hour minute avoids a busy scheduler boundary.
  # If GitHub starts the job late, it still runs rather than silently skipping.
  schedule:
    - cron: "17 7 * * *"
      timezone: "America/New_York"

jobs:
  send-digest:
    runs-on: ubuntu-latest
    permissions:
      # The generated artifact must be committed before the homepage workflow
      # can clone it and publish a fresh version of the digest.
      contents: write

    # These env vars come from GitHub repository secrets.
    # Add them in:
    # Settings > Secrets and variables > Actions
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
      DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
      HOMEPAGE_REPO_DISPATCH_TOKEN: ${{ secrets.HOMEPAGE_REPO_DISPATCH_TOKEN }}
      MIN_DIGEST_ITEMS: 8
      # Set this to true while you are learning or testing the workflow manually.
      # Change it back to false before relying on the scheduled send.
      DRY_RUN: "false"

    steps:
      - name: Confirm scheduled or manual run
        id: send_window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run detected. Continuing."
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Scheduled run detected. Continuing even if GitHub started it late."

      - name: Check out the repository
        if: steps.send_window.outputs.should_run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        if: steps.send_window.outputs.should_run == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.send_window.outputs.should_run == 'true'
        run: npm ci

      - name: Run tests before sending
        if: steps.send_window.outputs.should_run == 'true'
        run: npm test

      - name: Typecheck before sending
        if: steps.send_window.outputs.should_run == 'true'
        run: npm run typecheck

      - name: Build and send the digest
        if: steps.send_window.outputs.should_run == 'true'
        run: npm run send:digest:ci

      - name: Publish latest digest artifact
        id: publish_artifact
        if: steps.send_window.outputs.should_run == 'true' && env.DRY_RUN != 'true' && github.ref_name == github.event.repository.default_branch
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --short -- digests/latest-digest.json)" ]; then
            echo "No digest artifact changes to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          digest_id="$(node -e 'const fs = require("fs"); const artifact = JSON.parse(fs.readFileSync("digests/latest-digest.json", "utf8")); process.stdout.write(artifact.digestId);')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/latest-digest.json
          git commit -m "Publish digest artifact for ${digest_id}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Published digest artifact for ${digest_id}."

      - name: Trigger homepage digest sync
        if: steps.send_window.outputs.should_run == 'true' && env.DRY_RUN != 'true' && env.HOMEPAGE_REPO_DISPATCH_TOKEN != '' && github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ env.HOMEPAGE_REPO_DISPATCH_TOKEN }}
          HOMEPAGE_REPO_FULL_NAME: ${{ vars.HOMEPAGE_REPO_FULL_NAME }}
        run: |
          set -euo pipefail

          target_repo="${HOMEPAGE_REPO_FULL_NAME:-junejajai402/time-snapshot}"

          payload="$(node -e 'const fs = require("fs"); const artifact = JSON.parse(fs.readFileSync("digests/latest-digest.json", "utf8")); process.stdout.write(JSON.stringify({ event_type: "sync-digest-artifact", client_payload: { digest_artifact_path: "digests/latest-digest.json", digest_id: artifact.digestId, digest_ref: process.env.GITHUB_REF_NAME, digest_repo: process.env.GITHUB_REPOSITORY } }));')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$target_repo/dispatches" \
            -d "$payload"

          echo "Triggered homepage sync for $target_repo."
