name: Daily Digest

concurrency:
  group: daily-digest-send
  cancel-in-progress: false

# Purpose:
# This workflow runs the digest in GitHub Actions on a schedule or manually.
# It keeps the cloud path close to the local flow so the email send and artifact
# export behavior stay easy to reason about.
#
# Good next learning steps:
# - keep the dry-run path handy when you change ranking or source logic
# - inspect artifact output in the logs when a scheduled run looks suspicious
# - keep the homepage sync step pointed at the same canonical artifact
# - keep workflow concurrency and email idempotency aligned so one digest does not send twice

on:
  workflow_dispatch:

  # GitHub cron uses UTC, not your local timezone.
  # To keep a stable 7:00 AM New York send time across daylight saving changes,
  # we schedule both possible UTC hours and gate the run inside the job.
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"

jobs:
  send-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # These env vars come from GitHub repository secrets.
    # Add them in:
    # Settings > Secrets and variables > Actions
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
      DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
      HOMEPAGE_REPO_DISPATCH_TOKEN: ${{ secrets.HOMEPAGE_REPO_DISPATCH_TOKEN }}
      MIN_DIGEST_ITEMS: 8
      # Set this to true while you are learning or testing the workflow manually.
      # Change it back to false before relying on the scheduled send.
      DRY_RUN: "false"

    steps:
      - name: Check New York send window
        id: send_window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run detected. Continuing."
            exit 0
          fi

          ny_hour="$(TZ=America/New_York date +%H)"

          if [ "$ny_hour" = "07" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "It is 7 AM in New York. Continuing scheduled run."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scheduled run because New York local hour is $ny_hour, not 07."
          fi

      - name: Check out the repository
        if: steps.send_window.outputs.should_run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        if: steps.send_window.outputs.should_run == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.send_window.outputs.should_run == 'true'
        run: npm ci

      - name: Run tests before sending
        if: steps.send_window.outputs.should_run == 'true'
        run: npm test

      - name: Typecheck before sending
        if: steps.send_window.outputs.should_run == 'true'
        run: npm run typecheck

      - name: Build and send the digest
        if: steps.send_window.outputs.should_run == 'true'
        run: npm run send:digest:ci

      - name: Trigger homepage digest sync
        if: steps.send_window.outputs.should_run == 'true' && env.DRY_RUN != 'true' && env.HOMEPAGE_REPO_DISPATCH_TOKEN != '' && github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ env.HOMEPAGE_REPO_DISPATCH_TOKEN }}
          HOMEPAGE_REPO_FULL_NAME: ${{ vars.HOMEPAGE_REPO_FULL_NAME }}
        run: |
          set -euo pipefail

          target_repo="${HOMEPAGE_REPO_FULL_NAME:-junejajai402/time-snapshot}"

          payload="$(node -e 'const fs = require("fs"); const artifact = JSON.parse(fs.readFileSync("tmp/digest/latest-digest.json", "utf8")); process.stdout.write(JSON.stringify({ event_type: "sync-digest-artifact", client_payload: { digest_artifact_path: "tmp/digest/latest-digest.json", digest_id: artifact.digestId, digest_ref: process.env.GITHUB_REF_NAME, digest_repo: process.env.GITHUB_REPOSITORY } }));')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$target_repo/dispatches" \
            -d "$payload"

          echo "Triggered homepage sync for $target_repo."
